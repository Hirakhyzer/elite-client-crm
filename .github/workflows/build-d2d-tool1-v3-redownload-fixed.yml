name: Build D2D Tool1 V3 Redownload Fixed
on:
  push:
    paths:
      - 'artifact-build/tool1-v3-redownload/build2.py'
      - '.github/workflows/build-d2d-tool1-v3-redownload-fixed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: python3 artifact-build/tool1-v3-redownload/build2.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2d-tool1-eligibility-portal-v3-fixed
          path: build/d2d-tool1-eligibility-portal-v3.zip
          if-no-files-found: error
