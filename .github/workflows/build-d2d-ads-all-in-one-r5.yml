name: Build D2D Ads All-in-One R5

on:
  push:
    branches:
      - chatgpt-d2d-phase4-artifact
    paths:
      - 'artifacts_src/d2d-ads-all-in-one-r5/**'
      - '.github/workflows/build-d2d-ads-all-in-one-r5.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          set -e
          find artifacts_src/d2d-ads-all-in-one-r5 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build ZIP
        run: |
          set -e
          cd artifacts_src/d2d-ads-all-in-one-r5
          zip -r "$GITHUB_WORKSPACE/d2d-ads-all-in-one-r5.zip" .
          unzip -t "$GITHUB_WORKSPACE/d2d-ads-all-in-one-r5.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: d2d-ads-all-in-one-r5
          path: d2d-ads-all-in-one-r5.zip
          if-no-files-found: error
