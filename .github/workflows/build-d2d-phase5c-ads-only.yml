          <?php
          declare(strict_types=1);
          $base=__DIR__;
          $path=$base.'/storage/app/phase5-ads-only-manifest.json';
          if(!is_file($path)){fwrite(STDERR,"No ads-only manifest found.\n");exit(1);}
          $m=json_decode((string)file_get_contents($path),true);
          if(!is_array($m)||empty($m['backup'])){fwrite(STDERR,"Invalid ads-only manifest.\n");exit(1);}
          $backup=$m['backup'];
          foreach(($m['replaced']??[]) as $rel){$src=$backup.'/'.$rel;$dst=$base.'/'.$rel;if(is_file($src)){@mkdir(dirname($dst),0775,true);copy($src,$dst);echo "Restored: $rel\n";}}
          foreach(($m['created']??[]) as $rel){$dst=$base.'/'.$rel;if(is_file($dst)){unlink($dst);echo "Removed: $rel\n";}}
          echo "Rollback complete. Run php artisan optimize:clear\n";
          PHP

          cat > "$PKG/README.md" <<'MD'
          # D2D Phase 5C — Ads Only Safe Layer

          This package is intentionally isolated. It does **not** overwrite your current page work.

          ## Hard whitelist — ads only on single detail pages
          - `/blog/{slug}`
          - `/universities/{slug}`
          - `/scholarships/{slug}`
          - `/opportunities/{slug}`
          - `/jobs/{slug}`

          ## Hard blocked everywhere else
          Homepage, all listing pages, guidebooks/resources (including single guidebooks), tools, CRM, Student Portal and Consultant Portal stay ad-free.

          ## Preview safety
          `preview.dares2dream.com` never makes a live Google AdSense request. It shows placement placeholders only.

          ## Auto Ads
          Keep Auto Ads OFF. If the CRM setting says Auto Ads is ON, this renderer blocks live ads instead of risking automatic placement across a detail page.

          ## What the installer changes
          It adds new ads-only files and registers one service provider in `bootstrap/providers.php`.
          It does not edit existing Blade views, controllers, `routes/web.php`, or existing website CSS/JS.
          It does not edit `ads.txt`.

          ## Install
          Extract into `/home/daresdre/d2d-laravel/`, then:

          ```bash
          cd ~/d2d-laravel
          php install-phase5c-ads-only.php
          php artisan optimize:clear
          php artisan phase5:ads-doctor
          ```

          Do not run migrations.

          ## Rollback
          ```bash
          cd ~/d2d-laravel
          php rollback-phase5c-ads-only.php
          php artisan optimize:clear
          ```
          MD

          php -l "$PKG/install-phase5c-ads-only.php"
          php -l "$PKG/rollback-phase5c-ads-only.php"

