              'routes/phase5-ads-console.php' => <<<'FILE'
          <?php
          use App\Services\Phase5\D2dAdsConfig;
          use Illuminate\Support\Facades\Artisan;

          Artisan::command('phase5:ads-doctor', function (D2dAdsConfig $ads) {
              $d=$ads->diagnostics(); $s=$d['settings'];
              $this->newLine(); $this->info('D2D Phase 5C — Ads Only Doctor'); $this->line(str_repeat('=',46));
              $this->line('Settings source: '.($s['source']?:'not detected'));
              $this->line('Prepare AdSense: '.($s['prepare_adsense']?'ON':'OFF'));
              $this->line('Publisher ID: '.($s['publisher_id']?:'not detected'));
              $this->line('Auto Ads: '.($s['auto_ads']?'ON — LIVE ADS BLOCKED UNTIL OFF':'OFF'));
              $this->line('Test mode: '.($s['test_mode']?'ON':'OFF'));
              $this->line('ads.txt setting: '.($s['ads_txt']?'detected':'not detected / untouched'));
              $this->newLine(); $this->info('Approved single-detail pages only');
              foreach($d['approved'] as $x)$this->line('  - '.$x);
              $this->newLine(); $this->line('Settings tables: '.(implode(', ',$d['settings_tables'])?:'none detected'));
              $this->line('Ad rule tables: '.(implode(', ',$d['rule_tables'])?:'none detected'));
              $this->newLine(); $this->info('Hard blocks');
              $this->line('Homepage, listings, guidebooks/resources, tools, CRM and Portal: ALWAYS ad-free.');
              $this->line('preview.dares2dream.com: live Google requests ALWAYS suppressed.');
              $this->line('No migrations. No database writes.');
              return 0;
          });
          FILE,
          ];

          $stamp = date('Ymd-His');
          $backup = $base.'/storage/app/phase5-backups/ads-only-'.$stamp;
          @mkdir($backup, 0775, true);
          $manifest = ['backup'=>$backup,'created'=>[],'replaced'=>[]];

          foreach ($files as $relative=>$contents) {
              $target = $base.'/'.$relative;
              if (is_file($target)) {
                  @mkdir(dirname($backup.'/'.$relative), 0775, true);
                  copy($target, $backup.'/'.$relative);
                  $manifest['replaced'][] = $relative;
              } else {
                  $manifest['created'][] = $relative;
              }
              @mkdir(dirname($target), 0775, true);
              file_put_contents($target, $contents);
              echo "Installed: {$relative}\n";
          }

          $providers = $base.'/bootstrap/providers.php';
          if (!is_file($providers)) {
              fwrite(STDERR, "ERROR: bootstrap/providers.php not found.\n");
              exit(1);
          }
          @mkdir(dirname($backup.'/bootstrap/providers.php'), 0775, true);
          copy($providers, $backup.'/bootstrap/providers.php');
          $manifest['replaced'][] = 'bootstrap/providers.php';

          $content = (string)file_get_contents($providers);
          $provider = 'App\\Providers\\D2dAdsServiceProvider::class';
          if (!str_contains($content, $provider)) {
              $pos = strrpos($content, '];');
              if ($pos === false) {
                  fwrite(STDERR, "ERROR: Could not safely register ads provider.\n");
                  exit(1);
              }
              $before = rtrim(substr($content, 0, $pos));
              $after = substr($content, $pos);
              $comma = str_ends_with($before, ',') ? '' : ',';
              $content = $before.$comma."\n    ".$provider.",\n".$after;
              file_put_contents($providers, $content);
              echo "Registered ads provider.\n";
          } else {
              echo "Ads provider already registered.\n";
          }

          @mkdir($base.'/storage/app', 0775, true);
          file_put_contents($base.'/storage/app/phase5-ads-only-manifest.json', json_encode($manifest, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));

          echo "\nADS-ONLY SAFETY:\n";
          echo "- Existing Blade pages untouched.\n";
          echo "- Existing controllers untouched.\n";
          echo "- routes/web.php untouched.\n";
          echo "- Existing website CSS/JS untouched.\n";
          echo "- CRM and Portal untouched.\n";
