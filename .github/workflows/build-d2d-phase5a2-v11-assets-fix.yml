name: Build D2D Phase 5A.2 V11 Assets Fix

on:
  push:
    branches:
      - chatgpt-d2d-phase4-artifact
    paths:
      - 'artifact/d2d-public-phase5a2-v11-assets-fix/**'
      - '.github/workflows/build-d2d-phase5a2-v11-assets-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          php -l artifact/d2d-public-phase5a2-v11-assets-fix/app/Http/Controllers/PublicSiteController.php
          php -l artifact/d2d-public-phase5a2-v11-assets-fix/install-phase5a2-v11-assets.php
      - name: Build ZIP
        run: |
          cd artifact/d2d-public-phase5a2-v11-assets-fix
          zip -r ../../d2d-public-phase5a2-v11-assets-fix.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2d-public-phase5a2-v11-assets-fix
          path: d2d-public-phase5a2-v11-assets-fix.zip
          retention-days: 7
